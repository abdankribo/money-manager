<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledger — Money Manager</title><link rel="stylesheet" href="style.css"></head><body><main><nav><img src="assets/logo.svg"><strong>LEDGER</strong><button id="theme">◐</button></nav><header><div><span>PERSONAL FINANCE</span><h1>Money Manager</h1><p>Ringkas, pantau, dan pahami arus keuanganmu.</p></div><button id="add">+ New transaction</button></header><section class="cards" id="cards"></section><section class="layout"><div class="panel chart"><header><h2>Cash flow</h2><select id="month"><option>September 2026</option><option>August 2026</option></select></header><canvas id="flow" width="700" height="280"></canvas></div><div class="panel"><h2>Expense categories</h2><div id="cats"></div></div></section><section class="panel"><header><h2>Transactions</h2><div><input id="search" placeholder="Search..."><button id="export">CSV</button></div></header><div id="transactions"></div></section></main><dialog id="dialog"><form id="form"><h2>New transaction</h2><input id="title" placeholder="Description" required><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><select id="category"><option>Food</option><option>Transport</option><option>Housing</option><option>Shopping</option><option>Salary</option><option>Other</option></select><input id="amount" type="number" min="1" placeholder="Amount" required><input id="date" type="date" required><button>Save transaction</button></form></dialog><script src="script.js"></script></body></html>
